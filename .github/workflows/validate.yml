name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile $(find custom_components -name "*.py")
          echo "Python OK"
      - name: Hassfest (manifest)
        uses: home-assistant/actions/hassfest@master