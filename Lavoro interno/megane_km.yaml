###########################  CARICHE FUORI  ###############################

  - alias: "Aggiorna kWh caricati Megane in tempo reale"
    id: aggiorna_kwh_megane_realtime
    description: "Calcola i kWh caricati ad ogni variazione di % batteria (solo BEB e Colonnine)"
    trigger:
      - platform: state
        entity_id: sensor.battery_level
    condition:
      - condition: state
        entity_id: binary_sensor.charging
        state: "on"   # aggiorna solo se la macchina sta caricando
    action:
      - variables:
          prev: "{{ states('input_number.previous_battery_level') | float(0) }}"
          curr: "{{ states('sensor.battery_level') | float(0) }}"
          diff: "{{ curr - prev }}"
      - if:
          - condition: template
            value_template: "{{ diff > 0 }}"   # aggiorna solo se è salita la % di batteria
        then:
          - choose:
              # 🏨 Caso 1: carica al B&B
              - conditions:
                  - condition: template
                    value_template: "{{ states('device_tracker.location') == 'beb' }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.megane_ricarica_beb_totale
                    data:
                      value: >
                        {{ (states('input_number.megane_ricarica_beb_totale') | float(0) + (diff * 0.60)) | round(2) }}

              # ⚡ Caso 2: colonnine pubbliche
              - conditions:
                  - condition: template
                    value_template: "{{ states('device_tracker.location') not in ['home','beb'] }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.megane_ricarica_colonnine_totale
                    data:
                      value: >
                        {{ (states('input_number.megane_ricarica_colonnine_totale') | float(0) + (diff * 0.60)) | round(2) }}
          - service: input_number.set_value
            target:
              entity_id: input_number.previous_battery_level
            data:
              value: "{{ curr }}"


          
  - alias: "Salva inizio carica Megane"
    id: Salva inizio carica Megane
    trigger:
      - platform: state
        entity_id: binary_sensor.charging
        to: "on"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.megane_battery_start
        data:
          value: "{{ states('sensor.battery_level') | float(0) }}"
    mode: single

#############  RICARICA INTEGRAZIONE RENAULT ################

  - alias: Reload Renault Integration
    id: reloadintegrazione
    description: Ricarica integrazione ogni 30 minuti
    trigger:
     - platform: time_pattern
       hours: /1
    condition:
      - condition: state
        entity_id: sensor.mileage
        state: unavailable
    action:
      - service: homeassistant.reload_config_entry
        data: {}
        target:
          entity_id: device_tracker.location
    mode: single


  - alias: "Monitor Charging Efficiency"
    id: monitor_charging_efficiency
    trigger:
      - platform: state
        entity_id: sensor.wallbox_charger_state
        to: 'charging'
        for: '00:05:00'
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.charging_start_battery
        data:
          value: "{{ states('sensor.battery_level') | float(0) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.charging_start_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          
  - alias: "Charging Session Complete"
    id: charging_session_complete
    description: Notifica al termine della ricarica con calcolo energia e costo
    triggers:
    - platform: state
      entity_id: sensor.wallbox_charger_state
      from: charging
      to:
        - "disconnected"
        - "completed"
        - "available"
        - "need_auth"
        - "connected"
      for: "00:02:00"



    actions:
    - delay: "00:01:00"  # Tempo per far aggiornare i sensori
    - service: notify.michele
      data:
        title: "🔋 Ricarica Completata"
        message: >
          {% set start_battery = states('input_number.charging_start_battery') | float(0) %}
          {% set end_battery = states('sensor.battery_level') | float(0) %}
          {% set delta_battery = end_battery - start_battery %}
          {% if delta_battery < 0 %}
            {% set delta_battery = 0 %}
          {% endif %}
          
          {% set kwh_per_percent = 0.6 %}
          {% set energy_added = (delta_battery * kwh_per_percent) | round(2) %}
          {% set location = states('device_tracker.location') | lower %}
          {% set start_time = states('input_datetime.charging_start_time') %}
          
          {% if start_time not in ['unknown', 'unavailable', 'none', ''] and start_time is not none %}
            {% set charging_time = ((as_timestamp(now()) - as_timestamp(start_time)) / 3600) | round(2) %}
          {% else %}
            {% set charging_time = 0 %}
          {% endif %}
          
          {% if location == 'home' %}
            {% set cost_per_kwh = states('input_number.costo_energia_casa') | float(0) %}
          {% elif location == 'beb' %}
            {% set cost_per_kwh = states('input_number.costo_energia_beb') | float(0) %}
          {% else %}
            {% set cost_per_kwh = states('input_number.costo_energia_colonnina') | float(0) %}
          {% endif %}
          
          {% set total_cost = (energy_added * cost_per_kwh) | round(2) %}
          
          📍 Location: {{ location | title }}
          ⚡ Energia: {{ energy_added }} kWh
          🕐 Tempo: {{ charging_time }} ore
          📊 Batteria: {{ start_battery }}% → {{ end_battery }}%
          💰 Costo stimato: €{{ total_cost }}


