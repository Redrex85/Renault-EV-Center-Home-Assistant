#             SCRIPT RESET                                 #
#                                                          #
############################################################


script:
  reset_sensori_energia_caricascarica:
    sequence:
    - service: utility_meter.calibrate
      data:
        value: "0"
      target:
        entity_id:
          - sensor.megane_battery_energy_bimonthly_charge
          - sensor.megane_battery_energy_bimonthly_discharge
          - sensor.megane_battery_energy_daily_charge
          - sensor.megane_battery_energy_daily_discharge
          - sensor.megane_battery_energy_weekly_charge
          - sensor.megane_battery_energy_weekly_discharge
          - sensor.megane_battery_energy_monthly_charge
          - sensor.megane_battery_energy_monthly_discharge
          - sensor.megane_battery_energy_yearly_charge
          - sensor.megane_battery_energy_yearly_discharge
          - sensor.megane_battery_energy_total_charge
          - sensor.megane_battery_energy_total_discharge    


  reset_sensori_percorrenza:
    sequence:
    - service: utility_meter.calibrate
      data:
        value: "0"
      target:
        entity_id:    
          - sensor.km_annuali
          - sensor.km_giornalieri
          - sensor.km_mensili
          - sensor.km_settimanali
          
  reset_sensori_colonnina:
    sequence:

    - service: utility_meter.calibrate
      data:
        value: '0'
      target:
        entity_id:
          - sensor.megane_energia_caricata_colonnina_giornaliera

          - sensor.megane_energia_caricata_colonnina_settimana

          - sensor.megane_energia_caricata_colonnina_mese

          - sensor.megane_energia_caricata_colonnina_anno


  reset_sensori_beb:
    sequence:
      - service: utility_meter.calibrate
        data:
          value: '0'
        target:
          entity_id:
            - sensor.megane_energia_caricata_beb_giornaliera

            - sensor.megane_energia_caricata_beb_settimana

            - sensor.megane_energia_caricata_beb_mese

            - sensor.megane_energia_caricata_beb_anno

  


