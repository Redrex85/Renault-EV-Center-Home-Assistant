automation:
  
  - alias: Megane correzione carica/scarica
    id: meganecaricascarica
    trigger:
      - platform: state
        entity_id: sensor.charge_state
    action:
      - service: select.select_option
        target:
          entity_id:
            - select.megane_battery_energy_daily
            - select.megane_battery_energy_weekly
            - select.megane_battery_energy_monthly
            - select.megane_battery_energy_bimonthly
            - select.megane_battery_energy_yearly
            - select.megane_battery_energy_total
            - select.megane_battery_perc_giorno


        data:
          option: "{{ 'discharge' if states('sensor.charge_state') == 'not_in_charge' else 'charge' }}"         

