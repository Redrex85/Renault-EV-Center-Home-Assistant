homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Centro Ricarica Megane 2.0'
        author: 'Redrex'
        setting:

####################################################
#                                                  #
#              IMPOSTAZIONI PACKAGE                #
#                                                  #
####################################################

        Sensore Consumo Generale W: &power "{{ states('sensor.wallbox_instant_power') }}"

            #SOSTITUISCI  sensor.wallbox_instant_power_watts  CON IL TUO SENSORE DELLA wallbox #
            
            # SOSTITUISCI GLI ALTRI SENSORI CONTRASSEGNATI CON   RIGO 220 , 478 , 481 , 488 , 493 , 495 ##

####################################################
#                                                  #
#               INPUT NUMBER                       #
#                                                  #
####################################################

input_number:
  costo_energia_megane:
      name: Costo Energia
      min: 0.000
      max: 99999.000
      unit_of_measurement: '€/kWh'
      step: 0.01
      mode: box
      icon: mdi:currency-eur
      

####################################################
#                                                  #
#            INPUT NUMBER KWH CONSUMATI            #
#                                                  #
####################################################

  kwh_consumati_lunedi_megane:
    name: Kwh Consumati Lunedì Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh

####################################################

  kwh_consumati_martedi_megane:
    name: Kwh Consumati Martedì Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh

####################################################

  kwh_consumati_mercoledi_megane:
    name: Kwh Consumati Mercoledì Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh

####################################################

  kwh_consumati_giovedi_megane:
    name: Kwh Consumati Giovedì Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh

####################################################

  kwh_consumati_venerdi_megane:
    name: Kwh Consumati Venerdì Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh

####################################################

  kwh_consumati_sabato_megane:
    name: Kwh Consumati Sabato Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh

####################################################

  kwh_consumati_domenica_megane:
    name: Kwh Consumati Domenica Megane
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: kWh
    
####################################################

  soglia_lavoro_elettrodomestici_w_wallbox:
    name: Soglia Lavoro Elettrodomestici W
    icon: mdi:flash
    min: 0
    max: 999999
    step: 1.00
    unit_of_measurement: "w"
    mode: box

  tempo_innesco_elettrodomestici_m_wallbox:
    name: Tempo Innesco Elettrodomestici M
    icon: mdi:flash
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "m"
    mode: box

####################################################
#                                                  #
#               TEMPLATE                           #
#                                                  #
####################################################

template:
  
  - binary_sensor:
      - name: wallbox_Megane
        icon: mdi:car
        state: >-
          {% set power = state_attr('sensor.w_kwh_megane', 'source') %}
          {{ states(power) | int(0) > states('input_number.soglia_lavoro_elettrodomestici_w_wallbox') | int(0) }}
        delay_off: "00:{{ states('input_number.tempo_innesco_elettrodomestici_m_wallbox') | int(0) }}:00"

  - sensor:
      - name: "Stato Wallbox"
        icon: mdi:history
        state: >-
          {% from 'history_stats_custom.jinja' import time_on %}
          {{ time_on('binary_sensor.wallbox_megane') }}

  - trigger:
      - platform: time
        at: "00:00:01"
      - platform: time_pattern
        minutes: "/30"   # Aggiornamento ogni 30 minuti
      - platform: state
        entity_id:
          - binary_sensor.wallbox_megane
          - script.reset_sensori_energia_megane
        from: "on"
        to: "off"
        for:
          seconds: 2
    sensor:
      - name: Storico Wallbox
        state: "{{ now().strftime('%d/%m/%Y %H:%M') }}"
        attributes:
          Settimanale: >-
            {% from 'history_stats_custom.jinja' import storico_statistiche, history %} 
            {% set this_entity = state_attr('sensor.storico_wallbox', 'Settimanale') %}
            {% set consumo = states('sensor.energia_oggi_megane') | float(0) | round(2) %}
            {% set costo = (consumo * states('input_number.costo_energia_casa') | float(0)) | round(2, default=0) %}
            {% set cicli = '0' %}
            {% set tempo = 'False' %}
            {% set km = states('sensor.km_giornalieri') | float(0) | round(0) %}            
            {% set reset = trigger.entity_id == 'script.reset_sensori_energia_megane' %}
            {{ storico_statistiche('giorni', this_entity, costo, consumo, cicli, tempo, km, reset) | from_json }}
          Mensile: >-
            {% from 'history_stats_custom.jinja' import storico_statistiche, history %} 
            {% set this_entity = state_attr('sensor.storico_wallbox', 'Mensile') %}
            {% set consumo = states('sensor.energia_mese_megane') |float(0) | round(2) %}
            {% set costo = (consumo * states('input_number.costo_energia_casa') | float(0)) | round(2, default=0) %}
            {% set cicli = '0' %}
            {% set tempo = 'False' %}
            {% set km = states('sensor.km_mensili') | float(0) | round(0) %}            
            {% set reset = trigger.entity_id == 'script.reset_sensori_energia_megane' %}
            {{ storico_statistiche('mesi', this_entity, costo, consumo, cicli, tempo, km, reset) | from_json }}
            
#########################   COSTI € / KM  #################################
  - sensor:
      - name: "Costo per km Megane"
        unique_id: costo_km_megane
        unit_of_measurement: "€/km"
        state: >
          {% set km_per_kwh = states('sensor.megane_km_per_kwh')|float(0) %}
          {% set prezzo = states('input_number.costo_energia_megane')|float(0) %}
          
          {% if km_per_kwh > 0 %}
            {% set kwh_per_km = 1 / km_per_kwh %}
            {{ (kwh_per_km * prezzo) | round(3) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:currency-eur

  - sensor:
      - name: "Costo per 100 km Megane"
        unique_id: costo_100km_megane
        unit_of_measurement: "€/100km"
        state: >
          {% set kwh_100 = states('sensor.megane_kwh_per_100_km')|float(0) %}
          {% set prezzo = states('input_number.costo_energia_megane')|float(0) %}
          {{ (kwh_100 * prezzo) | round(2) }}
        icon: mdi:currency-eur
            
            


  - sensor:
      - name: "Media Consumi Settimanali Megane"
        unique_id: media_consumi_settimanali_megane
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set lunedi = states('input_number.kwh_consumati_lunedi_megane') | float(0) %}
          {% set martedi = states('input_number.kwh_consumati_martedi_megane') | float(0) %}
          {% set mercoledi = states('input_number.kwh_consumati_mercoledi_megane') | float(0) %}
          {% set giovedi = states('input_number.kwh_consumati_giovedi_megane') | float(0) %}
          {% set venerdi = states('input_number.kwh_consumati_venerdi_megane') | float(0) %}
          {% set sabato = states('input_number.kwh_consumati_sabato_megane') | float(0) %}
          {% set domenica = states('input_number.kwh_consumati_domenica_megane') | float(0) %}
          {{ ((lunedi + martedi + mercoledi + giovedi + venerdi + sabato + domenica) / 7) | round(2) }}        

################# STIMA RICARICA ##################################

# TEMPLATE SENSOR TEMPO RICARICA STIMATO


  - sensor:
      - name: "Tempo Ricarica Stimato"
        unique_id: tempo_ricarica_stimato
        icon: mdi:clock-end
        state: >
          {% set bl = states('sensor.battery_level') %}
          {% set ml = states('input_number.max_battery_level') %}
          {% set pw = states('sensor.sensore_potenza_megane_w') %}
          {% set charging = states('binary_sensor.charging') %}
          
          {% if bl not in ['unknown', 'unavailable'] and
                ml not in ['unknown', 'unavailable'] and
                pw not in ['unknown', 'unavailable'] %}
            {% set current_level = bl | float(0) %}
            {% set target_level  = ml | float(0) %}
            {% set power_watt    = pw | float(0) %}
            
            {# Calcola solo se in carica e con potenza > 0 #}
            {% if charging == 'on' and power_watt > 0 and current_level < target_level %}
              {% set percent_to_charge = target_level - current_level %}
              {% set energy_needed_kwh = percent_to_charge * 0.6 %}
              {% set power_kw = power_watt / 1000 %}
              {% set efficiency = 0.90 %}
              {% set adjusted_power = power_kw * efficiency %}
              
              {% if adjusted_power > 0 %}
                {% set total_minutes = (energy_needed_kwh / adjusted_power * 60) | round(0, 'ceil') %}
                {% set hh = (total_minutes // 60) | int %}
                {% set mm = (total_minutes % 60) | int %}
                {{ '{:02}:{:02}:00'.format(hh, mm) }}
              {% else %}
                Non disponibile
              {% endif %}
            {% elif current_level >= target_level %}
              Completo
            {% elif charging == 'off' or charging in ['unknown', 'unavailable'] %}
              Non in carica
            {% else %}
              00:00:00
            {% endif %}
          {% else %}
            Non disponibile
          {% endif %}
        attributes:
          stato_ricarica: >
            {% if states('binary_sensor.charging') == 'on' %}
              In carica
            {% elif states('sensor.battery_level') | float(0) >= states('input_number.max_battery_level') | float(0) %}
              Completo
            {% else %}
              Non in carica
            {% endif %}
          potenza_attuale: "{{ states('sensor.sensore_potenza_megane_w') | float(0) / 1000 | round(2) }} kW"
          energia_rimanente: >
            {% set current = states('sensor.battery_level') | float(0) %}
            {% set target = states('input_number.max_battery_level') | float(0) %}
            {% if target > current %}
              {{ ((target - current) * 0.6) | round(2) }} kWh
            {% else %}
              0 kWh
            {% endif %}            



#########  Template sensor per ora di completamento stimata  #########

  - sensor:
      - name: "Ora Completamento Ricarica"
        unique_id: ora_completamento_ricarica
        icon: mdi:clock-time-four
        state: >
          {% set tempo_ricarica = states('sensor.tempo_ricarica_stimato') %}
          {% set charging = states('binary_sensor.charging') %}
          
          {% if charging == 'on' and tempo_ricarica not in ['Non disponibile', 'Non in carica', 'Completo', '00:00:00'] %}
            {% set ore, minuti, secondi = tempo_ricarica.split(':') | map('int') | list %}
            {% set total_minuti = ore * 60 + minuti %}
            {% set completamento = now() + timedelta(minutes=total_minuti) %}
            {{ completamento.strftime('%H:%M') }}
          {% elif tempo_ricarica == 'Completo' %}
            Completo
          {% else %}
            --:--
          {% endif %}

############     Costo stimato della ricarica corrente  ##########
      - name: "Costo Ricarica Corrente Stimato"
        unique_id: costo_ricarica_corrente_stimato
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set energia_rimanente = state_attr('sensor.tempo_ricarica_stimato', 'energia_rimanente') %}
          {% set location = states('device_tracker.location') %}
          
          {% if energia_rimanente and energia_rimanente != '0 kWh' %}
            {% set kwh_needed = energia_rimanente.replace(' kWh', '') | float(0) %}
            {% if location == 'home' %}
              {% set costo_kwh = states('input_number.costo_energia_casa') | float(0) %}
            {% elif location == 'beb' %}
              {% set costo_kwh = states('input_number.costo_energia_beb') | float(0) %}
            {% else %}
              {% set costo_kwh = states('input_number.costo_energia_colonnina') | float(0) %}
            {% endif %}
            {{ (kwh_needed * costo_kwh) | round(2) }}
          {% else %}
            0.00
          {% endif %}
          
          

