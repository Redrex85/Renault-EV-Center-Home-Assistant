####################################################
#                                                  #
#                   SENSORI                        #
#                                                  #
####################################################

sensor:


  - platform: statistics
    name: "potenza_importata_15min"
    entity_id: sensor.sensore_potenza_casa_w     ## SOSITUISCI CON IL TUO SENSORE DEI CONSUMI GENERALI DELLA CASA DI SOLITO SHELLY EM#
    state_characteristic: mean
    precision: 0
    max_age:
      minutes: 15



####################################################

  - platform: integration
    source: sensor.sensore_potenza_megane_w
    name: w_kwh_megane
    unit_prefix: k
    method: left
    round: 2
    unique_id: w_kwh_megane







####################################################
#                                                  #
#                METER ENERGIA CARICA Megane       #
#                                                  #
####################################################

utility_meter:

  energia_ogni_ora_megane:
    unique_id: energia_ogni_ora_megane
    source: sensor.w_kwh_megane
    cycle: hourly

  energia_oggi_megane:
    unique_id: energia_oggi_megane
    source: sensor.w_kwh_megane
    cycle: daily

  energia_settimana_megane:
    unique_id: energia_settimana_megane
    source: sensor.w_kwh_megane
    cycle: weekly

  energia_mese_megane:
    unique_id: energia_mese_megane
    source: sensor.w_kwh_megane
    cycle: monthly

  energia_bimestre_megane:
    unique_id: energia_bimestre_megane
    source: sensor.w_kwh_megane
    cycle: bimonthly

  energia_anno_megane:
    unique_id: energia_anno_megane
    source: sensor.w_kwh_megane
    cycle: yearly
    

####################### F1 e F2 ####################

  consumo_giornaliero_megane:
    source: sensor.w_kwh_megane
    cycle: daily 
    tariffs:
      - f1
      - f2
      
  consumo_mensile_megane:
    source: sensor.w_kwh_megane
    cycle: monthly
    tariffs:
      - f1
      - f2
      
  consumo_settimana_megane:
    source: sensor.w_kwh_megane
    cycle: weekly
    tariffs:
      - f1
      - f2   
      
  consumo_anno_megane:
    source: sensor.w_kwh_megane
    cycle: yearly
    tariffs:
      - f1
      - f2      


####################################################
#                                                  #
#                       SCRIPT                     #
#                                                  #
####################################################
script:

  reset_sensori_energia_megane:
    sequence:
      - service: utility_meter.calibrate
        data:
          value: '0'
        target:
          entity_id:
            - sensor.energia_ogni_ora_megane
            - sensor.energia_oggi_megane
            - sensor.energia_settimana_megane
            - sensor.energia_mese_megane
            - sensor.energia_bimestre_megane
            - sensor.energia_anno_megane


       
####################################################
#                                                  #
#                     AUTOMAZIONI                  #
#                                                  #
####################################################

automation:

- alias: Incremento Kwh
  id: incremento_kwh_megane
  trigger:
    platform: state
    entity_id: sensor.energia_oggi_megane
  action:
    - service: input_number.set_value
      target:
        entity_id: >
          {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
          {% if (today in ["Monday"]) %} input_number.kwh_consumati_lunedi_megane
          {% elif (today in ["Tuesday"]) %} input_number.kwh_consumati_martedi_megane
          {% elif (today in ["Wednesday"]) %} input_number.kwh_consumati_mercoledi_megane
          {% elif (today in ["Thursday"]) %} input_number.kwh_consumati_giovedi_megane
          {% elif (today in ["Friday"]) %} input_number.kwh_consumati_venerdi_megane
          {% elif (today in ["Saturday"]) %} input_number.kwh_consumati_sabato_megane
          {% elif (today in ["Sunday"]) %} input_number.kwh_consumati_domenica_megane
          {% endif %}
      data:
        value: "{{states('sensor.energia_oggi_megane')}}"



- alias: Notifica avvio ricarica
  id: notifica_avvio_ricarica
  description: Invia notifica a inizio ricarica
  trigger:
    - platform: state
      entity_id: sensor.wallbox_charger_state
      to: "charging"
  conditions: []
  action:

    - service: notify.michele
      data:
        message: >
          🔋 La ricarica è iniziata alle {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
  mode: single




######################### POTENZA PRELEVATA ############################


# SOSTITUISCI CON I TUOI SENSORI DELLA WALLBOX #


- alias: notifica_potenza_importata_elevata
  id: notifica_potenza_elevata
  description: Regola la potenza massima prelevata durante la ricarica
  trigger:
    - platform: numeric_state
      entity_id: sensor.potenza_importata_15min
      above: 5500
      for:
        hours: 2
        minutes: 40
  condition:
    - condition: state
      entity_id: sensor.wallbox_charger_state      ## SOSTITUISCI CON SENSORE CARICA DELLA TUA WALLBOX , DI SOLITO LO STATO DI CARICA #
      state: charging
  action:
    - service: notify.michele    ## SOSTITUISCI CON IL I TUOI NOTIFY  #
      data:
        message: >-
          La potenza importata è stata superiore a 6kW per oltre 2 ore e 40
          minuti. Abbasso la potenza WallBox
    - service: number.set_value
      data:
        entity_id: number.wallbox_user_limit    #SOSTITUISCI CON IL SENSORE CHE CAMBIA LA POTENZA DI CARICA DELLA TUA WALLBOX  #
        value: "22"
    - delay: "00:15:00"
    - service: number.set_value
      data:
        entity_id: number.wallbox_user_limit    #SOSTITUISCI CON IL SENSORE CHE CAMBIA LA POTENZA DI CARICA DELLA TUA WALLBOX  #
        value: "25"
    - service: notify.michele   ## SOSTITUISCI CON IL I TUOI NOTIFY  #
      data:
        message: Potenza WallBox ripristinata
  mode: single
